name: smartexpense
description: "SmartExpense - Personal Finance Tracker with budgets, debts, savings goals, and analytics."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.2
  
  # Utilities
  intl: ^0.18.0
  uuid: ^4.3.3
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.0
  path_provider: ^2.1.2
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # Supabase Backend
  supabase_flutter: ^2.3.4
  
  # Auth
  google_sign_in: ^6.1.5
  
  # Charts & Analytics
  fl_chart: ^0.68.0
  
  # Export & Reports
  pdf: ^3.10.7
  printing: ^5.12.0
  csv: ^6.0.0
  permission_handler: ^11.3.0
  screenshot: ^2.1.0
  share_plus: ^7.2.1
  
  # Animations
  animate_do: ^3.1.2
  flutter_animate: ^4.3.0
  
  # SVG Support
  flutter_svg: ^2.0.9
  
  # URL Launcher
  url_launcher: ^6.2.4

  # HTTP for live exchange rates
  http: ^1.2.0

  #Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#102216"
    theme_color: "#13EC5B"
